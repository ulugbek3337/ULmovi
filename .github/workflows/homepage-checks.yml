name: Homepage checks

on:
  push:
    branches: [feature/homepage-redesign]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check public/js/auth.js
          node --check public/js/main.js
          node --check public/js/homepage-ui.js
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run responsive homepage browser tests
        run: node tests/homepage-browser-smoke.cjs
      - name: Verify homepage hooks
        run: |
          grep -q 'id="moviesGrid"' public/index.html
          grep -q 'id="yearFilter"' public/index.html
          grep -q 'id="sortFilter"' public/index.html
          grep -q 'js/homepage-ui.js' public/index.html
