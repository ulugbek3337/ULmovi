name: Code quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/admin-panel-upgrade

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP syntax (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint application PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find backend -type f -name '*.php' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found in backend/"
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

  javascript-check:
    name: JavaScript syntax (Node.js 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check application JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find public/js -type f -name '*.js' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript files found in public/js/"
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

  admin-chart-smoke:
    name: Admin dashboard chart smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test admin dashboard charts
        run: node tests/admin-dashboard-charts-smoke.cjs
