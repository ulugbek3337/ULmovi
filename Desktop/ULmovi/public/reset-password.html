<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>ULmovi — Parolni tiklash</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a href="index.html" class="logo">UL<span>movi</span></a>
        <h1>Yangi parol o‘rnating</h1>
        <p id="resetPasswordMessage" class="auth-message" role="status" aria-live="polite">Havola tekshirilmoqda…</p>
        <form id="resetPasswordForm" hidden>
            <div class="form-group">
                <label for="newResetPassword">Yangi parol (kamida 8 belgi)</label>
                <input id="newResetPassword" name="password" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="confirmResetPassword">Yangi parolni qayta kiriting</label>
                <input id="confirmResetPassword" name="password_confirmation" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
            </div>
            <button type="submit" class="submit-btn">Parolni yangilash</button>
        </form>
        <p><a href="index.html?auth=login">Kirish sahifasiga qaytish</a></p>
    </main>
    <script src="js/api.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
